document.addEventListener('dragover', (e) => { e.preventDefault(); });
document.addEventListener('drop', async (e) => {
  e.preventDefault();
  const files = e.dataTransfer.files;
  if (files.length === 0) return;
  let opened = 0, skipped = 0;
  for (const file of files) {
    const content = await file.text();
    const existingIdx = state.tabs.findIndex(t => t.filePath === file.name && t.content === content);
    if (existingIdx >= 0) { switchTab(existingIdx); skipped++; continue; }
    const ext = '.' + file.name.split('.').pop().toLowerCase();
    const lang = extMap[ext] || detectLanguage(file.name, content);
    state.tabs.push({
      id: Date.now() + Math.random(),
      name: file.name,
      language: lang,
      content: content,
      modified: false,
      fileHandle: null,
      filePath: file.name,
    });
    opened++;
  }
  if (opened > 0) switchTab(state.tabs.length - 1);
  const msgs = [];
  if (opened > 0) msgs.push(tf('已打开 {n} 个文件', { n: opened }));
  if (skipped > 0) msgs.push(tf('{n} 个已打开(跳过)', { n: skipped }));
  showToast(msgs.join(t('，')));
});

// ==================== AI 代码清洗 ====================
let _cleanResult = '';

function openCleanModal() {
  const overlay = $('#clean-modal-overlay');
  overlay.style.display = 'flex';
  const input = $('#clean-input');
  const sel = textarea.value.substring(textarea.selectionStart, textarea.selectionEnd);
  if (sel && sel.length > 10) {
    input.value = sel;
  } else if (textarea.value && textarea.value.length > 10) {
    input.value = textarea.value;
  }
  input.focus();
  runClean();
}

function closeCleanModal() {
  $('#clean-modal-overlay').style.display = 'none';
}

function runClean() {
  const raw = $('#clean-input').value;
  if (!raw.trim()) {
    $('#clean-preview').textContent = t('(粘贴内容后自动清洗)');
    $('#clean-stats').textContent = '';
    return;
  }
  const stripHtml = $('#clean-strip-html').checked;
  const extractBlocks = $('#clean-extract-blocks').checked;
  const mergeBlocks = $('#clean-merge').checked;
  const stripLineNums = $('#clean-strip-linenums').checked;
  const stripCommentary = $('#clean-strip-commentary').checked;
  const trimLines = $('#clean-trim-lines').checked;

  let result = raw;

  // Step 1: 去除 HTML 标签
  if (stripHtml) {
    result = result.replace(/&lt;/g, '<').replace(/&gt;/g, '>')
                   .replace(/&amp;/g, '&').replace(/&quot;/g, '"')
                   .replace(/&#39;/g, "'").replace(/&nbsp;/g, ' ');
    result = result.replace(/<span[^>]*>/gi, '').replace(/<\/span>/gi, '');
    result = result.replace(/<div[^>]*>/gi, '\n').replace(/<\/div>/gi, '');
    result = result.replace(/<p[^>]*>/gi, '\n').replace(/<\/p>/gi, '\n');
    result = result.replace(/<br\s*\/?>/gi, '\n');
    result = result.replace(/<code[^>]*>/gi, '').replace(/<\/code>/gi, '');
    result = result.replace(/<pre[^>]*>/gi, '').replace(/<\/pre>/gi, '');
    result = result.replace(/<strong[^>]*>/gi, '').replace(/<\/strong>/gi, '');
    result = result.replace(/<em[^>]*>/gi, '').replace(/<\/em>/gi, '');
    result = result.replace(/<b>/gi, '').replace(/<\/b>/gi, '');
    result = result.replace(/<i>/gi, '').replace(/<\/i>/gi, '');
    result = result.replace(/<ol[^>]*>/gi, '\n').replace(/<\/ol>/gi, '');
    result = result.replace(/<ul[^>]*>/gi, '\n').replace(/<\/ul>/gi, '');
    result = result.replace(/<li[^>]*>/gi, '\n').replace(/<\/li>/gi, '');
    result = result.replace(/<a[^>]*>/gi, '').replace(/<\/a>/gi, '');
    result = result.replace(/<[^>]+>/g, '');
    result = result.replace(/&lt;/g, '<').replace(/&gt;/g, '>')
                   .replace(/&amp;/g, '&').replace(/&quot;/g, '"')
                   .replace(/&#39;/g, "'").replace(/&nbsp;/g, ' ');
  }

  // Step 2: 提取 Markdown 代码块
  if (extractBlocks) {
    const blockRegex = /```[^\n]*\n([\s\S]*?)```/g;
    const blocks = [];
    let match;
    while ((match = blockRegex.exec(result)) !== null) {
      blocks.push(match[1]);
    }
    if (blocks.length > 0) {
      result = mergeBlocks ? blocks.join('\n\n') : blocks.map((b, i) =>
        '// --- Code Block ' + (i+1) + ' ---\n' + b
      ).join('\n\n');
    } else {
      const simpleFence = /```\s*\n([\s\S]*?)```/g;
      const simpleBlocks = [];
      let sm;
      while ((sm = simpleFence.exec(result)) !== null) {
        simpleBlocks.push(sm[1]);
      }
      if (simpleBlocks.length > 0) {
        result = mergeBlocks ? simpleBlocks.join('\u000a\u000a') : simpleBlocks.map((b, i) =>
          '// --- Code Block ' + (i+1) + ' ---\u000a' + b
        ).join('\u000a\u000a');
      } else if (stripCommentary) {
        result = removeCommentaryText(result);
      }
    }
  } else if (stripCommentary) {
    result = removeCommentaryText(result);
  }

  // Step 3: 去行号
  if (stripLineNums) {
    result = result.split('\n').map(line => {
      const m = line.match(/^(\s*)(\d{1,6})([|:\s\t]{1,3})(.*)/);
      if (m && m[4] && m[4].trim() && !/^\d+\s*$/.test(m[4].trim())) return m[1] + m[4];
      return line;
    }).join('\n');
  }

  // Step 4: 去多余空行
  if (trimLines) {
    result = result.replace(/\u000a{3,}/g, '\u000a\u000a').replace(/^\u000a+/, '').replace(/\u000a+$/, '\u000a');
  }

  result = result.split('\n').map(l => l.trimEnd()).join('\n');

  // Step 5: 去 AI 回复的开场/结束语（属于文本描述，随选项控制）
  if (stripCommentary) {
    result = result.replace(/^(当然|好的|没问题|Here's|Let me|我来|下面是|以下是).{0,80}?[：:\u000a]/gmi, '');
    result = result.replace(/(希望|如果有|如果你|Feel free|Let me know|Happy).{0,120}?$/gmi, '');
  }

  _cleanResult = result.trim();
  $('#clean-preview').textContent = _cleanResult || t('(未提取到有效代码)');
  const lines = _cleanResult.split('\n').length;
  const chars = _cleanResult.length;
  $('#clean-stats').textContent = tf('{lines} 行 | {chars} 字符', { lines, chars });
}

function removeCommentaryText(text) {
  const lines = text.split('\n');
  const result = [];
  let inCode = false;
  let codeScore = 0;
  for (const line of lines) {
    const trimmed = line.trim();
    const isCodeLike =
      /^[\s{}();\[\]=+\-*\/<>!&|^%~@#]+/.test(trimmed) ||
      /^(function|def|class|import|from|export|const|let|var|if|for|while|return|public|private|protected|static|void|int|string|bool|float|double|package|require|module|async|await)\b/.test(trimmed) ||
      /^(#include|#define|#if|#ifdef|#ifndef|#endif|#pragma|using|namespace|template|SELECT|INSERT|UPDATE|DELETE|CREATE|DROP|ALTER)\b/.test(trimmed) ||
      /^[a-zA-Z_$][\w.]*\s*[:=]\s*/.test(trimmed) ||
      /[{}\[\];]\s*$/.test(trimmed) ||
      /^\s*\/\/|\/\*|\*\/|<!--|-->|#\s/.test(trimmed);
    if (isCodeLike || (inCode && trimmed.length > 0)) {
      if (!inCode && isCodeLike) inCode = true;
      result.push(line);
      codeScore++;
    } else if (trimmed.length === 0 && inCode) {
      result.push(line);
    }
  }
  return result.join('\n').trim() || text;
}

function applyCleanResult(mode) {
  if (!_cleanResult) { showToast(t('没有可用的清洗结果')); return; }
  const lang = detectCleanLang();
  closeCleanModal();
  if (mode === 'replace') {
    const tab = state.tabs[state.activeTabIdx];
    if (!tab) return;
    textarea.value = _cleanResult;
    tab.language = lang; tab.content = _cleanResult;
    tab.modified = true;
    langSelect.value = lang;
    state.lastContent = _cleanResult;
    state.undoStack = []; state.redoStack = [];
    highlight(); updateGutter(); updateCursor(); updateStatusBar(); renderTabs();
    showToast(t('代码已清洗并替换当前内容'));
  } else if (mode === 'append') {
    const tab = state.tabs[state.activeTabIdx];
    if (!tab) return;
    textarea.value += '\n\n' + _cleanResult;
    tab.content = textarea.value; tab.modified = true;
    langSelect.value = lang;
    state.lastContent = textarea.value;
    highlight(); updateGutter(); updateCursor(); updateStatusBar();
    showToast(t('代码已追加到当前文件'));
  } else {
    const tab = {
      id: Date.now(), name: 'cleaned-' + (state.tabs.length + 1),
      language: lang, content: _cleanResult, modified: true,
      fileHandle: null, filePath: null,
    };
    state.tabs.push(tab);
    switchTab(state.tabs.length - 1);
    showToast(t('清洗结果已创建为新标签页'));
  }
}

function detectCleanLang() {
  const c = _cleanResult || '';
  if (/^(<\?xml|<html|<\!DOCTYPE|<!DOCTYPE)/i.test(c.trim())) return 'html';
  if (/^(function\s|const\s|let\s|var\s|import\s|export\s|require\(|console\.|document\.|window\.|=>\s*{)/m.test(c)) return 'javascript';
  if (/^(import\s|from\s|interface\s|type\s|:\s*(string|number|boolean)\b)/m.test(c)) return 'typescript';
  if (/^(def\s|class\s|import\s|from\s\w+\s+import|if\s+__name__|print\(|#{0,1}\s*-\*-)/m.test(c)) return 'python';
  if (/^(public\s+class|package\s|import\s+java)/m.test(c)) return 'java';
  if (/^(public\s|private\s|protected\s|static\s|void\s|int\s|string\s|\#include|using\s+namespace)/m.test(c)) return 'cpp';
  if (/^(package\s+main|func\s|import\s+")/m.test(c)) return 'go';
  if (/^(fn\s|use\s|mod\s|let\s+mut|pub\s)/m.test(c)) return 'rust';
  if (/^(SELECT\s|INSERT\s|UPDATE\s|DELETE\s|CREATE\s|DROP\s|ALTER\s)/mi.test(c)) return 'sql';
  if (/^(\.\w+\s*\{|@import|@media|@keyframes|\#[\w-]+\s*\{)/m.test(c)) return 'css';
  if (/^(\{[\s\S]*\}|\[\s*\{)/m.test(c.trim())) return 'json';
  if (/^(\w+:\s|-\s+\w+:|#\s*---)/m.test(c)) return 'yaml';
  if (/^(#!\/bin\/|if\s+\[\[|then|fi|echo\s|grep\s|awk\s|sed\s|export\s)/m.test(c)) return 'bash';
  if (/^(Get-|Set-|Write-|param\()/m.test(c)) return 'powershell';
  if (/^(@echo\s|REM\s|set\s|if\s+exist|call\s)/mi.test(c)) return 'dos';
  if (/^(require\s+|def\s+|module\s+|class\s+|puts\s)/m.test(c)) return 'ruby';
  if (/^(<\?php|namespace\s|use\s+\w+\\|echo\s)/m.test(c)) return 'php';
  return 'plaintext';
}

// 实时预览
$('#clean-input').addEventListener('input', runClean);
document.querySelectorAll('#clean-options input[type=checkbox]').forEach(cb => {
  cb.addEventListener('change', runClean);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#clean-modal-overlay').style.display === 'flex') {
    closeCleanModal();
  }
});
$('#clean-input').addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault(); applyCleanResult('replace');
  }
});

// ==================== 启动 ====================
// 中英文文案：加载时按 localStorage('app_lang') 应用；主页面切换语言时 storage 联动刷新
applyI18n();
window.addEventListener('storage', e => {
  if (e.key === 'app_lang') { applyI18n(); renderTabs(); updateStatusBar(); hideTabContextMenu(); }
});
try {
  if (typeof hljs === 'undefined') {
    // 本地 highlight.js 缺失时降级为纯文本显示，不阻塞编辑器启动
    const _esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    window.hljs = {
      highlight: (code) => ({ value: _esc(code) }),
      highlightAuto: (code) => ({ value: _esc(code) })
    };
  }
  init();
  console.log('AI Code Editor Ready - Notepad++ Style');
  console.log('支持格式: 开发语言|脚本|Shell/Bash/PowerShell/Batch/DOS|XML/JSON/YAML/Toml|AI Prompt/Config|等70+种');
  console.log('快捷键: Ctrl+N 新建|Ctrl+O 打开|Ctrl+S 保存|Ctrl+F 查找|Ctrl+/ 注释|Ctrl+D 复制行|Ctrl+Z/Y 撤销/重做');
} catch(e) {
  console.error('Init Error:', e.message, e.stack);
  document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;bottom:10px;right:10px;background:red;color:white;padding:8px 16px;border-radius:4px;z-index:9999;">' + t('错误') + ': ' + e.message + '</div>');
  document.getElementById('toast').textContent = 'Error: ' + e.message;
  document.getElementById('toast').classList.add('show');
}
</script>
