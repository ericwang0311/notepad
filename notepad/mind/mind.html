// 用指定密码解锁并验证
async function unlockNotesKey(pwd) {
  await DB.init();
  const saltB64 = await DB.getMeta('salt');
  const token = await DB.getMeta('verifyToken');
  if (!saltB64 || !token) throw new Error(t('未找到笔记账户，请先在记事本中使用'));
  await CryptoManager.init(pwd, CryptoManager.base64ToSalt(saltB64));
  if (!await CryptoManager.verifyPassword(token)) {
    CryptoManager.key = null;
    throw new Error(t('密码错误'));
  }
}

// 免密模式：解包主应用存储的密码后自动解锁
async function tryAutoUnlockNotes() {
  if (localStorage.getItem('nopass_mode') !== 'true') return false;
  try {
    let pwd = null;
    const secret = localStorage.getItem('auto_unlock_secret');
    const wrapped = localStorage.getItem('wrapped_pwd');
    if (secret && wrapped) pwd = await CryptoManager.decryptWithPassword(secret, wrapped);
    else pwd = localStorage.getItem('saved_pwd'); // 兼容旧版明文
    if (!pwd) return false;
    await unlockNotesKey(pwd);
    return true;
  } catch (e) { return false; }
}

async function unlockNotePicker() {
  const pwd = document.getElementById('npPwdInput').value;
  if (!pwd) { document.getElementById('npErr').textContent = t('请输入密码'); return; }
  try {
    await unlockNotesKey(pwd);
    await loadNotePickerList();
  } catch (e) {
    document.getElementById('npErr').textContent = e.message || '解锁失败';
  }
}

async function loadNotePickerList() {
  document.getElementById('npPwdStep').style.display = 'none';
  document.getElementById('npListStep').style.display = 'block';
  const listEl = document.getElementById('npList');
  listEl.innerHTML = '<div class="np-empty">' + t('加载中…') + '</div>';
  try {
    const records = await DB.getAllNotes();
    _npNotes = [];
    for (const rec of records) {
      try {
        const plain = JSON.parse(await CryptoManager.decrypt(rec.data));
        _npNotes.push({ record: rec, plain });
      } catch (e) { /* 解密失败的条目跳过 */ }
    }
    // 默认按笔记日期倒序，同日按更新时间倒序
    _npNotes.sort((a, b) => {
      const da = a.plain.date || '', db = b.plain.date || '';
      if (da !== db) return db.localeCompare(da);
      return new Date(b.plain.updatedAt || 0) - new Date(a.plain.updatedAt || 0);
    });
    renderNotePickerList(document.getElementById('npSearch').value);
  } catch (e) {
    listEl.innerHTML = '<div class="np-empty">' + t('笔记列表加载失败') + '</div>';
    document.getElementById('npErr2').textContent = e.message || '';
  }
}

// 按关键字过滤并渲染列表（搜索标题与正文）
let _npFiltered = [];
function renderNotePickerList(keyword) {
  const listEl = document.getElementById('npList');
  if (_npNotes.length === 0) {
    _npFiltered = [];
    listEl.innerHTML = '<div class="np-empty">' + t('暂无笔记，请先在记事本中创建') + '</div>';
    return;
  }
  const kw = (keyword || '').trim().toLowerCase();
  _npFiltered = kw
    ? _npNotes.filter(it =>
        (it.plain.title || '').toLowerCase().includes(kw) ||
        String(it.plain.content || '').replace(/<[^>]+>/g, '').toLowerCase().includes(kw))
    : _npNotes.slice();
  if (_npFiltered.length === 0) {
    listEl.innerHTML = '<div class="np-empty">' + t('未找到匹配的笔记') + '</div>';
    return;
  }
  listEl.innerHTML = _npFiltered.map((it, i) => `
    <div class="np-item" onclick="pickNote(${i})">
      <span>${it.plain.pinned ? '📌' : '≡'}</span>
      <span>
        <div class="np-t">${npEscapeHtml(it.plain.title || t('无标题'))}</div>
        <div class="np-d">${it.plain.date || ''}${it.plain.attachments && it.plain.attachments.length ? ' · ' + tf('{n} 个附件', { n: it.plain.attachments.length }) : ''}</div>
      </span>
    </div>`).join('');
}

function npEscapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function pickNote(idx) {
  const it = _npFiltered[idx];
  if (!it) return;
  try {
    const blob = await getMindPngBlob();
    // 读取图片原始尺寸，宽或高超过 10cm 的等比例缩到 10cm
    const tmpUrl = URL.createObjectURL(blob);
    const dims = await new Promise((res, rej) => {
      const tmpImg = new Image();
      tmpImg.onload = () => res({ natW: tmpImg.naturalWidth, natH: tmpImg.naturalHeight });
      tmpImg.onerror = () => rej(new Error('图片尺寸读取失败'));
      tmpImg.src = tmpUrl;
    });
    URL.revokeObjectURL(tmpUrl);
    const natW = dims.natW, natH = dims.natH;
    const MAX_CM_PX = 10 * 96 / 2.54; // 10cm 对应的 CSS 像素（≈377.95px）
    const scale = Math.min(1, MAX_CM_PX / natW, MAX_CM_PX / natH);
    const dispW = Math.round(natW * scale), dispH = Math.round(natH * scale);
    // 转 base64 内嵌到笔记正文
    const dataUrl = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => rej(new Error('图片编码失败'));
      fr.readAsDataURL(blob);
    });
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const stamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    // 以图片形式追加到富文本内容末尾
    it.plain.content = (it.plain.content || '') +
      `<p><img src="${dataUrl}" width="${dispW}" height="${dispH}" alt="思维导图 ${stamp}"></p>`;
    it.plain.updatedAt = now.toISOString();
    await DB.saveNote({ id: it.plain.id, date: it.plain.date, data: await CryptoManager.encrypt(JSON.stringify(it.plain)) });
    closeNotePicker();
    mindToast(tf('已导出到笔记“{title}”', { title: it.plain.title || t('无标题') }));
  } catch (e) {
    document.getElementById('npErr2').textContent = t('导出失败') + ': ' + (e.message || e);
  }
}

// ============ SAVE / OPEN ============
function serializeNode(node) {
  return {
    id: node.id,
    text: node.text,
    note: node.note,
    collapsed: node.collapsed,
    themeIdx: node.themeIdx,
    color: node.color,
    _side: node._side,
    _free: node._free || false,
    customColor: node.customColor,
    customShape: node.customShape,
    customBgColor: node.customBgColor,
    fontColor: node.fontColor,
    fontSize: node.fontSize,
    customLineWidth: node.customLineWidth,
    children: node.children.map(serializeNode)
  };
}

function deserializeNode(obj, parent = null) {
  const node = new MindNode(obj.text, parent);
  node.id = obj.id;
  node.note = obj.note || '';
  node.collapsed = !!obj.collapsed;
  node.themeIdx = obj.themeIdx || 0;
  node.color = obj.color || branchColors[(obj.themeIdx || 0) % 8];
  node._side = obj._side || 'right';
  node._free = !!obj._free;
  node.customColor = obj.customColor || '';
  node.customShape = obj.customShape || '';
  node.customBgColor = obj.customBgColor || '';
  node.fontColor = obj.fontColor || '';
  node.fontSize = obj.fontSize || '';
  node.customLineWidth = obj.customLineWidth || 0;
  node.children = (obj.children || []).map(c => deserializeNode(c, node));
  return node;
}

function saveMindFile() {
  const data = {
    version: 2,
    layoutMode: layoutMode,
    alignMode: alignMode,
    globalLineStyle: globalLineStyle,
    globalLineWidth: globalLineWidth,
    globalFontSize: globalFontSize,
    globalDefaultBgColor: globalDefaultBgColor,
    themeStyle: themeStyle,
    root: serializeNode(root)
  };

  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = getLang() === 'en' ? 'mind-map.mind' : '思维导图.mind';
  a.click();
  URL.revokeObjectURL(url);
  clearDirty();
}

function openMindFile(input) {
  const file = input.files[0];
  if (!file) return;

  const doOpen = () => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data || !data.root) {
          alert(t('无效的思维导图文件格式'));
          return;
        }

        // Restore global settings
        layoutMode = data.layoutMode || 'right';
        alignMode = !!data.alignMode;
        globalLineStyle = data.globalLineStyle || 'curve';
        globalLineWidth = data.globalLineWidth || 2.5;
        globalFontSize = data.globalFontSize || 14;
        applyGlobalFontSize();
        globalDefaultBgColor = data.globalDefaultBgColor || '';
        themeStyle = localStorage.getItem('app_theme') === 'modern' ? 'modern' : 'note';

        // Fully replace the root tree — don't merge into the old root.
        root = deserializeNode(data.root, null);
        root._free = false;
        function resetFree(n) { n._free = false; n.children.forEach(resetFree); }
        resetFree(root);
        applyThemeStyle();

        selectedNode = root;
        draggingNode = null;
        hideCtxMenu();
        hideStylePanel();
        cancelNoteEdit();
        clearDirty();
        saveSession();

        // Update UI buttons
        document.getElementById('btnRight').classList.toggle('active', layoutMode === 'right');
        document.getElementById('btnBoth').classList.toggle('active', layoutMode === 'both');
        document.getElementById('lnCurve').classList.toggle('active', globalLineStyle === 'curve');
        document.getElementById('lnAngled').classList.toggle('active', globalLineStyle === 'angled');
        document.getElementById('btnAlign').classList.toggle('active', alignMode);

        // Update line width slider if exists
        const lwSlider = document.getElementById('lineWidthSlider');
        const lwVal = document.getElementById('lineWidthVal');
        if (lwSlider) lwSlider.value = globalLineWidth;
        if (lwVal) lwVal.textContent = globalLineWidth + 'px';

        // Render first so layout() recomputes all node positions including root,
        // then resetView() can center based on the new root.x/y/w/h.
        render();
        resetView();
        render();
        updateTransform();
        updateZoomLabel();
      } catch (err) {
        alert(t('文件解析失败') + ': ' + err.message);
      }
    };
    reader.readAsText(file);
    // Reset input so same file can be reopened
    input.value = '';
  };

  if (hasUnsavedChanges()) {
    showConfirm({
      title: t('打开文件'),
      msg: t('是否要保存当前内容'),
      onCancel: () => { input.value = ''; },
      onDiscard: () => doOpen(),
      onSave: () => { saveMindFile(); doOpen(); }
    });
    return;
  }
  doOpen();
}

// ============ INIT ============
// 页面关闭/切走时再保存一次，确保平移、缩放等未触发 markDirty 的状态也不丢失
window.addEventListener('pagehide', () => saveSession());
window.addEventListener('beforeunload', () => saveSession());
// 记事本全局主题切换时思维导图实时跟随（绿→青绿，现代→蓝紫）
window.addEventListener('storage', e => { if (e.key === 'app_theme') syncGlobalTheme(); });

// 中英文文案：加载时按 localStorage('app_lang') 应用；主页面切换语言时 storage 联动刷新
applyI18n();
window.addEventListener('storage', e => {
  if (e.key === 'app_lang') { applyI18n(); setMindMode(mode); }
});

document.documentElement.style.setProperty('--note-indicator-color', noteIndicatorColor);
initTipsHover();

const restored = restoreSession();
render();
if (restored) {
  updateTransform();
  updateZoomLabel();
  document.getElementById('btnAlign').classList.toggle('active', alignMode);
} else {
  clearDirty();
  // 先布局再居中：resetView 依赖 layout() 算出的根节点尺寸与位置
  render();
  resetView();
  render();
}
</script>
