<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流程图</title>
<style>
:root {
  --bg: #f0f2f5;
  --surface: #fff;
  --primary: #3d9a8b;
  --primary-hover: #2d7a6e;
  --primary-rgb: 61,154,139;
  --text: #1e293b;
  --text2: #64748b;
  --border: #e2e8f0;
  --danger: #ef4444;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.1);
  --radius: 8px;
  --radius-sm: 6px;
  --transition: 150ms ease;
  --toolbar-h: 48px;
  --sidebar-w: 182px;
  --props-w: 260px;
}
/* 跟随记事本全局主题：炫酷现代（蓝紫） */
body.theme-modern{--primary:#5b7ce8;--primary-hover:#8b5cf6;--primary-rgb:91,124,232}
body.theme-modern #title-grad stop:first-child{stop-color:#5b7ce8}
body.theme-modern #title-grad stop:last-child{stop-color:#8b5cf6}
body.theme-modern #arrowhead-primary polygon{fill:#5b7ce8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;font-size:14px;color:var(--text);background:var(--bg);overflow:hidden;height:100vh;user-select:none}
#app{display:flex;flex-direction:column;height:100vh}

/* Toolbar */
.toolbar{height:var(--toolbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:4px;z-index:100;box-shadow:var(--shadow);flex-shrink:0}
.toolbar .sep{width:1px;height:24px;background:var(--border);margin:0 6px}
.toolbar button,.toolbar .btn{padding:6px 10px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text);display:flex;align-items:center;gap:5px;transition:all var(--transition);white-space:nowrap}
.toolbar button:hover{background:#f1f5f9;border-color:#cbd5e1}
.toolbar button.active:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.toolbar button.accent{background:var(--primary);color:#fff;border-color:var(--primary)}
.toolbar button.accent:hover{background:var(--primary-hover)}
.toolbar button.active{background:var(--primary);border-color:var(--primary);color:#fff}
.toolbar .title{display:flex;align-items:center;gap:6px;font-weight:700;font-size:18px;margin-right:12px;user-select:none;background:linear-gradient(135deg,var(--primary),var(--primary-hover));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.toolbar .title .title-icon{flex-shrink:0}
.toolbar .zoom-label{font-size:12px;color:var(--text2);min-width:42px;text-align:center}

/* Main Layout */
.main{display:flex;flex:1;overflow:hidden;position:relative}

/* Sidebar Palette */
.palette{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;padding:12px;z-index:10;box-shadow:var(--shadow)}
.palette h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin:12px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.palette h3:first-child{margin-top:0}
.palette-items{display:flex;flex-wrap:wrap;gap:6px}
.palette-item{width:64px;padding:8px 4px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;cursor:grab;transition:all var(--transition);background:var(--surface);font-size:12px;color:var(--text2);text-align:center}
.palette-item:hover{border-color:var(--primary);background:#e6f5f2;box-shadow:0 0 0 1px var(--primary);color:var(--primary)}
.palette-item:active{cursor:grabbing;transform:scale(.95)}
.palette-item svg{width:36px;height:24px;margin-bottom:4px}
.palette-item span{line-height:1.2;font-size:11px}

/* Canvas */
.canvas-wrap{flex:1;overflow:hidden;position:relative;background:#e8ecf1}
.canvas-wrap.drag-over{background:#dbeafe}
#flow-canvas{width:100%;height:100%;display:block;cursor:default}
#flow-canvas.panning{cursor:grabbing}
#flow-canvas.connecting{cursor:crosshair}

/* Properties Panel */
.props-panel{width:var(--props-w);background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;flex-shrink:0;padding:16px;z-index:10;box-shadow:var(--shadow)}
.props-panel h3{font-size:13px;color:var(--text2);margin-bottom:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.props-panel .empty-state{text-align:center;color:var(--text2);padding:40px 0;font-size:13px}
.props-panel .empty-state svg{width:48px;height:48px;opacity:.3;margin-bottom:12px}
.props-panel label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500}
.props-panel input,.props-panel select,.props-panel textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;margin-bottom:12px;outline:none;transition:border var(--transition);background:var(--surface);color:var(--text)}
.props-panel input:focus,.props-panel select:focus,.props-panel textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(var(--primary-rgb),.1)}
.props-panel .color-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.props-panel .color-row input[type=color]{width:32px;height:32px;padding:2px;border-radius:var(--radius-sm);cursor:pointer}
.props-panel .prop-btns{display:flex;gap:6px;margin-bottom:12px}
.props-panel .prop-btns button{flex:1;padding:6px 0;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:12px;cursor:pointer;color:var(--text2);font-family:inherit;transition:all var(--transition)}
.props-panel .prop-btns button.active{border-color:var(--primary);color:#fff;background:var(--primary);font-weight:600}
.props-panel .prop-confirm{padding:6px 14px;border:none;border-radius:6px;background:var(--primary);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all var(--transition)}
.props-panel .prop-confirm:hover{filter:brightness(1.08)}
.props-panel{border-left:1px solid var(--border);transition:width .2s ease,padding .2s ease;position:relative}
.props-panel.collapsed{width:0!important;padding:0!important;overflow:hidden;border-left:none}
.props-panel.collapsed h3,.props-panel.collapsed .prop-fields{display:none}
.props-toggle{position:absolute;right:var(--props-w);top:50%;transform:translateY(-50%);width:16px;height:64px;background:var(--surface);border:1px solid var(--border);border-right:none;border-radius:6px 0 0 6px;cursor:pointer;transition:right .2s ease,background var(--transition),color var(--transition);color:var(--text2);font-size:11px;display:flex;align-items:center;justify-content:center;z-index:11;box-shadow:-2px 0 4px rgba(0,0,0,.05)}
.props-toggle:hover{background:#f1f5f9;color:var(--primary)}
.main.panel-collapsed .props-toggle{right:0}

/* Context Menu */
.ctx-menu{position:fixed;z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);min-width:180px;padding:6px;display:none;font-size:13px}
.ctx-menu.show{display:block}
.ctx-menu .ctx-item{padding:8px 12px;cursor:pointer;border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;transition:background var(--transition)}
.ctx-menu .ctx-item:hover{background:#f1f5f9;color:var(--primary)}
.ctx-menu .ctx-item.danger{color:var(--danger)}
.ctx-menu .ctx-item.danger:hover{background:#fef2f2}
.ctx-menu .ctx-sep{height:1px;background:var(--border);margin:4px 0}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:2000;opacity:0;transition:opacity 200ms;pointer-events:none}
.toast.show{opacity:1}

/* SVG shapes inline */
.shape-svg{pointer-events:none}
.node-group{cursor:move}
.node-group.selected .node-shape{filter:drop-shadow(0 0 4px rgba(var(--primary-rgb),.5))}
.node-shape{transition:filter var(--transition)}
.port{fill:#cbd5e1;stroke:#fff;stroke-width:1.5;cursor:crosshair;opacity:0;transition:all var(--transition)}
.port:hover,.port.port-hover{fill:var(--primary);opacity:1;r:6}
.node-group:hover .port,.node-group.selected .port{opacity:1}
#flow-canvas.connecting .port{opacity:0.7;r:7}
#flow-canvas.connecting .port:hover{fill:var(--primary);opacity:1;r:8}
.connection-path{fill:none;cursor:pointer;transition:stroke var(--transition)}
.connection-path:hover{stroke:var(--primary)}
.connection-path.selected{stroke:var(--primary);filter:drop-shadow(0 0 3px rgba(var(--primary-rgb),.4))}
/* Gray theme: no shadows/glows */
.theme-gray .node-group{filter:none!important}
.theme-gray .node-group.selected .node-shape{filter:none!important}
.theme-gray .connection-path.selected{filter:none!important}
.theme-gray .swimlane-group.selected .swimlane-rect{filter:none!important}
.connection-hitbox{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.swimlane-rect{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 3;fill:#f8fafc;rx:4;cursor:pointer;transition:all 150ms ease}
.swimlane-group.selected .swimlane-rect{stroke:var(--primary);stroke-width:3;fill:#e6f5f2;stroke-dasharray:none}
.swimlane-group:hover .swimlane-rect{stroke:#64748b}
.swimlane-label{font-size:14px;font-weight:600;fill:var(--text2);pointer-events:none}
.swimlane-resize{fill:var(--primary);opacity:0;cursor:ew-resize}
.swimlane-group:hover .swimlane-resize,.swimlane-group.selected .swimlane-resize{opacity:0.6}
.swimlane-resize-vertical{cursor:ns-resize}
.swimlane-header{fill:#f1f5f9}
.swimlane-group.selected .swimlane-header{fill:#e6f5f2}
.align-guide{stroke:#ef4444;stroke-width:1;stroke-dasharray:4 4;pointer-events:none}
#temp-layer,#guide-layer{pointer-events:none}
.selection-rect{fill:rgba(var(--primary-rgb),.1);stroke:var(--primary);stroke-width:1.5;stroke-dasharray:5 3;pointer-events:none}

/* 节点缩放手柄 */
.resize-handle{fill:#fff;stroke:var(--primary);stroke-width:1.5;opacity:0;pointer-events:all;transition:opacity var(--transition)}
.resize-handle[data-handle="nw"],.resize-handle[data-handle="se"]{cursor:nwse-resize}
.resize-handle[data-handle="ne"],.resize-handle[data-handle="sw"]{cursor:nesw-resize}
.node-group.selected .resize-handle{opacity:1}
/* 端口扩大点击区（便于拖拽连线） */
.port-hit{fill:transparent;stroke:none;cursor:crosshair}
/* 泳道双击改名输入框 */
.swimlane-rename{position:absolute;z-index:20;padding:4px 8px;font-size:14px;font-weight:600;font-family:inherit;text-align:center;border:1px solid var(--primary);border-radius:4px;outline:none;background:var(--surface);color:var(--text);box-shadow:0 0 0 3px rgba(var(--primary-rgb),.15)}
/* 组件注释：角标 / 悬停提示 / 编辑器 */
.note-indicator{fill:#f59e0b;stroke:#fff;stroke-width:1.5;pointer-events:none}
.note-indicator-text{font-size:9px;fill:#fff;pointer-events:none;user-select:none}
.note-tooltip{position:fixed;z-index:400;max-width:280px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:10px 14px;font-size:13px;color:var(--text);line-height:1.6;display:none;pointer-events:none;white-space:pre-wrap}
.note-tooltip::before{content:'⋯ 注释';display:block;font-size:11px;color:var(--primary);font-weight:600;margin-bottom:4px}
.note-editor-wrap{position:fixed;z-index:350;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px;display:none;flex-direction:column;gap:8px;min-width:260px}
.note-editor-wrap.show{display:flex}
.note-editor-wrap textarea{width:100%;height:80px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical;outline:none;color:var(--text);line-height:1.5}
.note-editor-wrap textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(var(--primary-rgb),.1)}
.note-editor-wrap .note-actions{display:flex;justify-content:flex-end;gap:6px}
.note-editor-wrap .note-actions button{padding:5px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:12px;cursor:pointer;font-family:inherit;transition:all var(--transition)}
.note-editor-wrap .note-actions button:hover{background:#f1f5f9}
.note-editor-wrap .note-actions button.primary{background:var(--primary);color:#fff;border:none}

/* 样式设置面板 */
.settings-panel{position:fixed;z-index:360;display:none;width:390px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:16px;flex-direction:column;gap:10px;max-height:calc(100vh - 24px);overflow-y:auto}
.settings-panel.show{display:flex}
.settings-panel .sp-title{font-size:14px;font-weight:700;color:var(--text)}
.settings-panel .sp-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);font-weight:500;margin-top:4px}
.settings-panel .sp-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.settings-panel input[type=range]{flex:1;accent-color:var(--primary);cursor:pointer}
.settings-panel .sp-swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform var(--transition);flex-shrink:0}
.settings-panel .sp-swatch:hover{transform:scale(1.15)}
.settings-panel .sp-swatch.active{border-color:var(--surface);box-shadow:0 0 0 2px var(--primary)}
.settings-panel .sp-style-btn{flex:1;padding:6px 0;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:12px;cursor:pointer;font-family:inherit;color:var(--text2);transition:all var(--transition)}
.settings-panel .sp-style-btn.active{border-color:var(--primary);color:#fff;background:var(--primary);font-weight:600}
.settings-panel .sp-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.settings-panel .sp-actions button{padding:5px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:12px;cursor:pointer;font-family:inherit;transition:all var(--transition)}
.settings-panel .sp-actions button:hover{background:#f1f5f9}
.settings-panel .sp-actions button.primary{background:var(--primary);color:#fff;border:none}

/* 导出菜单 / 笔记选择器 */
.exp-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:520;display:none}
.exp-box{position:fixed;z-index:521;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:20px 22px 16px;min-width:320px;max-width:440px;display:none}
.exp-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px}
.exp-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-family:inherit;transition:all var(--transition)}
.exp-opt:hover{border-color:var(--primary);background:#f5f3ff}
.exp-ico{font-size:20px;color:var(--primary);width:24px;text-align:center;flex-shrink:0}
.exp-name{font-size:13px;font-weight:600;color:var(--text)}
.exp-desc{font-size:12px;color:var(--text2)}
.np-hint{font-size:12px;color:var(--text2);margin-bottom:10px}
.np-search{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:13px;outline:none;margin-bottom:8px;font-family:inherit;box-sizing:border-box}
.np-search:focus{border-color:var(--primary)}
.np-pwd-row{display:flex;gap:8px;margin-bottom:8px}
.np-pwd-row input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:13px;outline:none;font-family:inherit}
.np-pwd-row input:focus{border-color:var(--primary)}
.np-btn{padding:8px 16px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:13px;cursor:pointer;flex:none;font-family:inherit}
.np-err{font-size:12px;color:#ef4444;min-height:16px;margin-bottom:4px}
.np-list{max-height:320px;overflow-y:auto;margin-top:4px}
.np-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:border-color var(--transition)}
.np-item:hover{border-color:var(--primary)}
.np-t{font-size:13px;font-weight:600;color:var(--text)}
.np-d{font-size:11px;color:var(--text2);margin-top:2px}
.np-empty{font-size:13px;color:var(--text2);text-align:center;padding:16px 0}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* Anim */
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .2s ease-out}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:1500;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:24px;min-width:360px}
.modal h3{margin-bottom:16px}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal button{padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);cursor:pointer;font-size:13px}
.modal button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
</style>
</head>
<body>
<div id="app">
  <div class="toolbar" id="toolbar">
        <span class="title"><svg class="title-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><defs><linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d9a8b"/><stop offset="1" stop-color="#2d7a6e"/></linearGradient></defs><g fill="url(#title-grad)"><rect x="3" y="3" width="18" height="4.5" rx="2"/><rect x="3" y="9.75" width="18" height="4.5" rx="2"/><rect x="3" y="16.5" width="18" height="4.5" rx="2"/><rect x="6" y="10.6" width="6" height="2.8" rx="1" fill="#ffffff"/></g></svg><span data-i18n>流程图</span></span>
    <div class="sep"></div>
    <button title="新建 (Ctrl+N)" data-i18n-title data-i18n>新建</button>
    <button title="保存 JSON" data-i18n-title data-i18n>保存</button>
    <button title="加载 JSON" data-i18n-title data-i18n>打开</button>
    <button title="导出" data-i18n-title data-i18n>导出</button>
    <div class="sep"></div>
    <button onclick="app.zoomOut()" title="缩小" data-i18n-title>−</button>
    <span class="zoom-label" id="zoom-label">100%</span>
    <button onclick="app.zoomIn()" title="放大" data-i18n-title>+</button>
    <button onclick="app.zoomFit()" title="适应画布" data-i18n-title>⊡</button>
    <div class="sep"></div>
    <button title="撤销 (Ctrl+Z)" data-i18n-title id="btn-undo" onclick="app.undo()">↩</button>
    <button title="重做 (Ctrl+Y)" data-i18n-title id="btn-redo" onclick="app.redo()">↪</button>
    <div class="sep"></div>
    <button onclick="app.addSwimlane('horizontal')" title="添加横向泳道" data-i18n-title data-i18n>横泳道</button>
    <button onclick="app.addSwimlane('vertical')" title="添加纵向泳道" data-i18n-title data-i18n>纵泳道</button>
    <div class="sep"></div>
    <button id="btn-select" class="active" onclick="app.setMode('select')" data-i18n>选择</button>
    <button id="btn-connect" onclick="app.setMode('connect')" data-i18n>连线</button>
    <button id="btn-pan" onclick="app.setMode('pan')" data-i18n>平移</button>
    <div class="sep"></div>
    <button id="btn-grid" onclick="toggleGrid()" title="显示/隐藏网格线" data-i18n-title data-i18n>网格</button>
    <button onclick="app.deleteSelected()" title="删除选中 (Delete)" data-i18n-title data-i18n>删除</button>
    <button onclick="openSettingsPanel()" title="样式设置" data-i18n-title data-i18n>⚙ 设置</button>
  </div>

  <div class="main">
    <aside class="palette" id="palette">
      <h3 data-i18n>基础形状</h3>
      <div class="palette-items" id="palette-basic"></div>
      <h3 data-i18n>高级形状</h3>
      <div class="palette-items" id="palette-advanced"></div>
    </aside>

    <div class="canvas-wrap" id="canvas-wrap">
      <svg id="flow-canvas" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="grid-minor" width="10" height="10" patternUnits="userSpaceOnUse">
            <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#d1d5db" stroke-width="0.3"/>
          </pattern>
          <pattern id="grid-major" width="50" height="50" patternUnits="userSpaceOnUse">
            <rect width="50" height="50" fill="url(#grid-minor)"/>
            <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#cbd5e1" stroke-width="0.5"/>
          </pattern>
          <marker id="arrowhead" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="0" refY="4" orient="auto">
            <polygon points="0 0, 9 4, 0 8" fill="#94a3b8"/>
          </marker>
          <marker id="arrowhead-primary" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="0" refY="4" orient="auto">
            <polygon points="0 0, 9 4, 0 8" fill="#3d9a8b"/>
          </marker>
          <filter id="node-shadow">

// ---------- 全局样式设置（设置面板可调，随文件保存/localStorage 记忆） ----------

let STYLE = {...STYLE_DEFAULTS};

// 连线颜色选项与思维导图分支配色保持一致，另加黑色/灰色
const LINE_COLOR_OPTIONS = ['#667eea','#f093fb','#4facfe','#43e97b','#fa709a','#f6d365','#a18cd1','#30cfd0','#f5576c','#4ecdc4','#1e293b','#94a3b8'];

// 设置箭头 marker 的几何与颜色；refY 同步为高度一半，避免箭头偏离连线中心
function setMarkerGeom(m, fill) {
  const a = STYLE.arrowSize, h = Math.max(4, Math.round(a * 8 / 9));
  m.setAttribute('markerWidth', a);
  m.setAttribute('markerHeight', h);
  m.setAttribute('refY', h / 2);
  const poly = m.querySelector('polygon');
  poly.setAttribute('points', `0 0, ${a} ${h/2}, 0 ${h}`);
  poly.setAttribute('fill', fill);
}

// 按连线颜色获取/创建对应箭头 marker（连线单独改色时箭头颜色跟随，不再出现黑三角）
function markerForColor(color) {
  const c = color || STYLE.lineColor;
  const id = 'arrow-' + c.replace(/[^a-zA-Z0-9]/g, '');
  if (!document.getElementById(id)) {
    const m = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
    m.setAttribute('id', id);
    m.setAttribute('markerUnits', 'userSpaceOnUse');
    m.setAttribute('refX', '0');
    m.setAttribute('orient', 'auto');
    m.dataset.markerColor = c;
    m.innerHTML = '<polygon points="0 0, 9 4, 0 8"/>';
    document.querySelector('#flow-canvas defs').appendChild(m);
    setMarkerGeom(m, c);
  }
  return id;
}

// 品牌主色：跟随记事本全局主题（现代→蓝紫，否则→青绿）
function brandPrimary() { return localStorage.getItem('app_theme') === 'modern' ? '#5b7ce8' : '#3d9a8b'; }

function applyStyleToCanvas() {
  // 箭头几何与颜色跟随设置（选中态箭头保持主题色）
  [['arrowhead', STYLE.lineColor], ['arrowhead-primary', brandPrimary()]].forEach(([id, fill]) => {
    const m = document.getElementById(id);
    if (m) setMarkerGeom(m, fill);
  });
  // 同步所有按连线颜色动态创建的箭头 marker
  document.querySelectorAll('marker[data-marker-color]').forEach(m => setMarkerGeom(m, m.dataset.markerColor));
}

let currentTheme = localStorage.getItem('flow-theme') || 'color';
if (!THEMES[currentTheme]) currentTheme = 'color';

function getShapeColors(type) {
  // 文本组件：默认无背景（透明度 0 控制）、无边框，颜色由专属属性控制
  if (type === 'text') return { fill: '#ffffff', stroke: 'none' };
  const theme = THEMES[currentTheme] || THEMES.color;
  const c = theme[type] || { fill: '#f1f5f9', stroke: '#64748b' };
  return c;
}

// hex 颜色 + 透明度(0-1) → rgba；非 hex 原样返回
function hexToRgba(hex, a) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return hex || 'transparent';
  const n = parseInt(m[1], 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

// ---------- SHAPE DEFINITIONS ----------
const SHAPES = {
  startend: {
    label: t('开始/结束'), icon: 'startend', category: 'basic',
    width: 150, height: 50,
    render(x,y,w,h) {
      return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h/2}" ry="${h/2}"/>`;
    }
  },
  process: {
    label: t('过程'), icon: 'rect', category: 'basic',
    width: 150, height: 56,
    render(x,y,w,h) { return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" ry="4"/>`; }
  },
  decision: {
    label: t('判断'), icon: 'diamond', category: 'basic',
    width: 130, height: 80,
    render(x,y,w,h) {
      return `<polygon points="${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}"/>`;
    }
  },
  document: {
    label: t('文档'), icon: 'doc', category: 'basic',
    width: 150, height: 60,
    render(x,y,w,h) {
      const wc = w * 0.15;
      const bounce = h * 0.12;
      return `<path d="M${x},${y} L${x+w},${y} L${x+w},${y+h-bounce} 
        Q${x+w-wc},${y+h+bounce} ${x+w-wc*2},${y+h-bounce} 
        Q${x+w-wc*3},${y+h+bounce} ${x+w-wc*4},${y+h-bounce} 
        Q${x+w-wc*5},${y+h+bounce} ${x},${y+h-bounce} Z"/>`;
    }
  },
  database: {
    label: t('数据库'), icon: 'db', category: 'basic',
    width: 150, height: 80,
    render(x,y,w,h) {
      const ry = h * 0.2;   // 椭圆半高
      let d = '';
      // 外轮廓：上弧 + 右侧 + 下弧 + 左侧
      d += `M ${x},${y+ry} C ${x},${y} ${x+w},${y} ${x+w},${y+ry}`;
      d += ` L ${x+w},${y+h-ry} C ${x+w},${y+h} ${x},${y+h} ${x},${y+h-ry} Z`;
      // 顶椭圆下沿（仅描边不填充，与上弧构成完整椭圆顶面）
      const lid = `M ${x},${y+ry} C ${x},${y+ry*2} ${x+w},${y+ry*2} ${x+w},${y+ry}`;
      return `<path d="${d}"/><path d="${lid}" fill="none"/>`;
    }
  },
  manual: {
    label: t('数据'), icon: 'trap', category: 'advanced',
    width: 150, height: 56,
    render(x,y,w,h) {
      const inset = w * 0.1;
      return `<polygon points="${x+inset},${y} ${x+w},${y} ${x+w-inset},${y+h} ${x},${y+h}"/>`;
    }
  },
  predefined: {
    label: t('预定义过程'), icon: 'predef', category: 'advanced',
    width: 150, height: 56,
    render(x,y,w,h) {

  delay: {
    label: t('延迟'), icon: 'delay', category: 'advanced',
    width: 140, height: 50,
    render(x,y,w,h) {
      // 标准延迟符号：左侧平直，右侧半圆凸起
      const r = h / 2;
      return `<path d="M${x},${y} L${x+w-r},${y} A${r},${r} 0 0,1 ${x+w-r},${y+h} L${x},${y+h} Z"/>`;
    }
  },
  circle: {
    label: t('连接点'), icon: 'cir', category: 'advanced',
    width: 40, height: 40,
    render(x,y,w,h) { return `<ellipse cx="${x+w/2}" cy="${y+h/2}" rx="${w/2}" ry="${h/2}"/>`; }
  },
  parallel: {
    label: t('并行模式'), icon: 'par', category: 'advanced',

    render(x,y,w,h) {
      const cy = y + h/2;

  },
  event: {
    label: t('事件'), icon: 'cir', category: 'bpmn',
    width: 48, height: 48,
    render(x,y,w,h) {
      const r = Math.min(w,h)/2;

        <circle cx="${x+r}" cy="${y+r}" r="${r-5}" fill="none" stroke-width="1.5"/>`;
    }
  },
  activity: {
    label: t('活动'), icon: 'rect', category: 'bpmn',
    width: 150, height: 60,
    render(x,y,w,h) { return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" ry="12"/>`; }

    width: 56, height: 56,
    render(x,y,w,h) {
      const cx = x + w/2, cy = y + h/2, s = 8;
      return `<polygon points="${cx},${y} ${x+w},${cy} ${cx},${y+h} ${x},${cy}"/>
        <line x1="${cx-s}" y1="${cy-s}" x2="${cx+s}" y2="${cy+s}" stroke-width="2.5"/>
        <line x1="${cx+s}" y1="${cy-s}" x2="${cx-s}" y2="${cy+s}" stroke-width="2.5"/>`;
    }
  },
  looplimit: {
    label: t('循环界限'), icon: 'loop', category: 'advanced',
    width: 150, height: 56,
    render(x,y,w,h) {
      const c = Math.min(h * 0.35, 18);
      return `<polygon points="${x+c},${y} ${x+w-c},${y} ${x+w},${y+c} ${x+w},${y+h} ${x},${y+h} ${x},${y+c}"/>`;
